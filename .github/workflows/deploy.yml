name: Deploy to Amazon ECS
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required deployment variables
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_SERVICE: ${{ vars.ECS_SERVICE }}
          ECS_TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -euo pipefail
          for name in AWS_REGION AWS_DEPLOY_ROLE_ARN ECR_REPOSITORY ECS_CLUSTER ECS_SERVICE ECS_TASK_DEFINITION APP_URL; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required repository variable $name is missing"
              exit 1
            fi
          done
          [[ "$ECR_REPOSITORY" == */* ]] || { echo "::error::ECR_REPOSITORY must be a full ECR repository URI"; exit 1; }
          [[ "$APP_URL" =~ ^https?:// ]] || { echo "::error::APP_URL must start with http:// or https://"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Build image
        env:
          IMAGE_TAG: "${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
        run: docker build --tag "${{ vars.ECR_REPOSITORY }}:${IMAGE_TAG}" .
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: "${{ vars.ECR_REPOSITORY }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Sign in and push image to ECR
        id: ecr
        env:
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          IMAGE_TAG: "${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
        run: |
          registry="${ECR_REPOSITORY%%/*}"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$registry"
          docker push "$ECR_REPOSITORY:$IMAGE_TAG"
      - name: Register updated task definition and deploy
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_SERVICE: ${{ vars.ECS_SERVICE }}
          ECS_TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION }}
          CONTAINER_NAME: api
          IMAGE_URI: "${{ vars.ECR_REPOSITORY }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
        run: |
          aws ecs describe-task-definition --task-definition "$ECS_TASK_DEFINITION" --query taskDefinition > task-definition.json
          jq --arg image "$IMAGE_URI" --arg name "$CONTAINER_NAME" \
            'if any(.containerDefinitions[]; .name == $name) then
               .containerDefinitions |= map(if .name == $name then .image = $image else . end)
             else error("container name not found in task definition") end
             | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' \
            task-definition.json > task-definition-updated.json
          task_arn=$(aws ecs register-task-definition --cli-input-json file://task-definition-updated.json --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --task-definition "$task_arn" >/dev/null
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
      - name: Verify public health endpoint
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: curl --fail --retry 10 --retry-delay 6 "$APP_URL/health"
